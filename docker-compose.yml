services:
  postgres:
    image: postgres:15-alpine
    container_name: dsa-journey-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dsa_journey
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dsa-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dsa-journey-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dsa_journey
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/dsa_journey
      SPRING_FLYWAY_USER: postgres
      SPRING_FLYWAY_PASSWORD: postgrespassword
    depends_on:
      - postgres
    networks:
      - dsa-network

volumes:
  postgres_data:

networks:
  dsa-network:
    driver: bridge
